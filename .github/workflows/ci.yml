name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Build (preview)
        run: pnpm build
        env:
          SITE_ENV: preview
      - name: Verify preview build
        run: pnpm verify-build preview
      - name: Build (production)
        run: pnpm build
        env:
          SITE_ENV: production
      - name: Verify production build
        run: pnpm verify-build production
